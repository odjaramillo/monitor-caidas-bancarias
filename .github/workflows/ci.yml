name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # gitleaks comments on the PR when it finds a secret

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks and commitlint read the full history
      - uses: pnpm/action-setup@v6 # reads the version from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependencies have no high or critical advisories
        run: pnpm audit --prod --audit-level high
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml is valid
        run: docker compose config -q
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true # the next step runs the image
          tags: mcb-api:ci
      - name: The API image boots and answers /health
        run: |
          docker run -d --name api -p 3000:3000 mcb-api:ci
          # The server needs a few seconds to start. Wait up to 30 s.
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://localhost:3000/health 2>/dev/null)" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The API image did not answer /health with {\"status\":\"ok\"} in 30 s."
          docker logs api
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
