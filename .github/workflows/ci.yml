name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The API tests run against a real PostgreSQL, like the one in compose.yaml (issue #20).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mcb
          POSTGRES_PASSWORD: mcb
          POSTGRES_DB: mcb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcb -d mcb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mcb:mcb@localhost:5432/mcb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads the commits of the PR
      # pnpm/action-setup reads the pnpm version from packageManager.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gate fails closed and reads the accepted advisories from audit-allowlist.json (#117).
      - name: Production dependencies have no high or critical advisories
        run: pnpm audit:prod
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Fails when coverage rose above its floor: the PR must raise the floor too (#120).
      - name: Coverage floors equal the measured coverage
        run: pnpm coverage:check
      - run: pnpm build
      # Browser tests of the two screens (issue #111). They start the API from the build above with
      # this job's PostgreSQL, and serve the static frontend. The frontend calls the API at its
      # default address, localhost:3000.
      - name: Install Chromium for the browser tests
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Browser tests (Playwright)
        run: pnpm --filter web test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose.yaml is valid
        run: docker compose config -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true # the next step runs the image
          tags: mcb-api:ci
      - name: The API image refuses to start without DATABASE_URL
        run: |
          if docker run --rm mcb-api:ci > out.txt 2>&1; then
            echo "::error::The API image started without DATABASE_URL."
            exit 1
          fi
          grep -q 'DATABASE_URL is not set' out.txt
      - name: Start the local PostgreSQL from compose.yaml
        run: docker compose up -d --wait postgres
      - name: The API image boots and answers /health
        run: |
          # --network host lets the container reach the PostgreSQL that compose publishes on localhost.
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://mcb:mcb@localhost:5432/mcb mcb-api:ci
          # The server needs a few seconds to start. Wait up to 30 s.
          # Each request waits 2 s at most, so a server that hangs cannot stop the loop.
          expected='{"status":"ok","database":"ok"}'
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(curl -fsS --max-time 2 http://localhost:3000/health 2>/dev/null)" = "$expected" ]; then
              exit 0
            fi
            # A stopped container never answers. Fail at once and show why it stopped.
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != true ]; then
              echo "::error::The API container stopped before it answered /health."
              docker logs api
              exit 1
            fi
            sleep 1
          done
          echo "::error::The API image did not answer /health with $expected in 30 s."
          docker logs api
          exit 1

  # gitleaks-action scans only the commits of the push or the PR. So the job runs the gitleaks
  # binary over every commit of every branch and tag (#117).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and tag with its full history
      - name: gitleaks scans every commit of the history
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz in the checksums file of the release,
          # and of the downloaded archive. Checked on 2026-10-22.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::The checkout is shallow, so gitleaks cannot read the full history. Set fetch-depth: 0."
            exit 1
          fi
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --max-time 60 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # These are the default log options of `gitleaks git`, written out: every commit of every ref.
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts="--full-history --all --diff-filter=tuxdb" .

  # Render deploys the API only from this job: Auto-Deploy is Off in Render (D23, #41).
  # It runs after the merge, so it is not a required check for PRs.
  deploy:
    needs: [checks, docker, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hard stop above the 15 min deadline of the /health step
    permissions: {} # the job only calls Render, so it needs no GitHub token scope
    # A newer merge replaces the older deploy, so the newer run cancels the older one.
    concurrency:
      group: deploy-render
      cancel-in-progress: true
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Render deploys the merged commit through its Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }} # read from env, never printed
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The secret RENDER_DEPLOY_HOOK_URL is empty. Add the Render Deploy Hook URL in the repository secrets."
            exit 1
          fi
          # The hook URL already has the key in its query. ref pins the deploy to the commit CI checked.
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -sS --fail --max-time 30 -X POST -o /dev/null "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${EXPECTED_COMMIT}"
          echo "Render accepted the deploy of $EXPECTED_COMMIT."
      - name: The API on Render answers /health with 200 and the merged commit
        env:
          HEALTH_URL: https://monitor-caidas-bancarias.onrender.com/health
          # Premise (measured 2026-10-23, run 39880815678): Render served the new commit about
          # 81 s after the hook. The 15 min cap leaves room for a slow build on the free plan.
          # Re-evaluate when a deploy takes more than 5 min.
          DEADLINE_SECONDS: 900
          INTERVAL_SECONDS: 20
          # The README says a sleeping API can take 50 s or more to answer the first request.
          CURL_MAX_TIME: 60
        run: |
          # Render keeps the old instance until the new one starts. A 200 alone can come from the old
          # instance, so the step also waits until /health reports the commit that CI checked.
          deadline=$((SECONDS + DEADLINE_SECONDS))
          while :; do
            out=$(curl -sS --max-time "$CURL_MAX_TIME" -w '\n%{http_code}' "$HEALTH_URL") || true
            code=${out##*$'\n'}
            body=${out%$'\n'*}
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null) || commit=''
            if [ "$code" = 200 ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Render serves $EXPECTED_COMMIT and /health answers 200: $body"
              exit 0
            fi
            echo "Waiting for $EXPECTED_COMMIT: HTTP $code, commit '${commit:-none}'."
            if [ $((SECONDS + INTERVAL_SECONDS)) -ge "$deadline" ]; then
              break
            fi
            sleep "$INTERVAL_SECONDS"
          done
          echo "::error::$HEALTH_URL did not answer 200 with commit $EXPECTED_COMMIT in $DEADLINE_SECONDS s."
          exit 1
