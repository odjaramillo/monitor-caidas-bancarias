name: Metrics

# Process metrics from the tracker (issue #121).
# The job only reads the tracker. It writes a table to the job summary and uploads the JSON.
# It never commits and never pushes. It is not a required check, so it never blocks a merge.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The script has no dependencies. gh reads the token from GH_TOKEN.
      - name: Lead time and merged PRs per ISO week
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/repo-contract/process-metrics.js --repo "$GITHUB_REPOSITORY" --weeks 12 --json "$RUNNER_TEMP/process-metrics.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-metrics
          path: ${{ runner.temp }}/process-metrics.json
          if-no-files-found: error
